name: RDP - Parsec + Tailscale (Fixed)

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 3600
    steps:
      - name: Ownership Verification (Encoded)
        run: |
          $encodedNotice = ""
          $decodedNotice = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($encodedNotice))
          Write-Host $decodedNotice
          if (-not $decodedNotice -or $decodedNotice -notlike "*facebook.com/Dr.Hussein.Ahmed.H*") {
              Write-Error "Copyright was tampered with or removed – script will not work!"
              exit 1
          }

      - name: Core RDP Settings + Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $password = "admin@123"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "HUSSEIN" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "HUSSEIN" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "HUSSEIN"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "HUSSEIN"
          echo "RDP_CREDS=User: HUSSEIN | Password: $password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) { Write-Error "Tailscale IP not assigned"; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      # ====================== Parsec + VDD (الجزء المعدل) ======================
      - name: Install Parsec Virtual Display Driver (VDD) - يحل -14003
        run: |
          $vddUrl = "https://github.com/nomi-san/parsec-vdd/releases/latest/download/parsec-vdd-setup.exe"
          $vddPath = "$env:TEMP\parsec-vdd-setup.exe"
          Invoke-WebRequest -Uri $vddUrl -OutFile $vddPath
          Start-Process -FilePath $vddPath -ArgumentList "/S", "/verysilent", "/norestart" -Wait -NoNewWindow
          Remove-Item $vddPath -Force
          Write-Host "✅ Parsec VDD installed successfully"

      - name: Install Parsec (Fixed Silent)
        run: |
          $parsecUrl = "https://parsec.app/downloads/parsec-windows.exe"
          $installerPath = "$env:TEMP\parsec.exe"
          Invoke-WebRequest -Uri $parsecUrl -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList "/verysilent", "/norestart", "/sp-", "/suppressmsgboxes" -Wait -NoNewWindow
          Remove-Item $installerPath -Force
          Write-Host "✅ Parsec installed successfully (verysilent mode)"

      - name: Maintain Connection + Parsec Info
        run: |
          Write-Host "`n=== RDP + PARSEC READY ==="
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Username     : HUSSEIN"
          Write-Host "Password     : admin@123"
          Write-Host "`n=== Parsec Instructions ==="
          Write-Host "1. افتح RDP على $env:TAILSCALE_IP"
          Write-Host "2. سجل دخول في Parsec (Hussein1h#19315983)"
          Write-Host "3. افتح ParsecVDisplay → Add Virtual Display (1920x1080)"
          Write-Host "4. Parsec Settings → Host → Hosting Enabled"
          Write-Host "5. ارجع لجهازك → Reload → Connect على runnervmxu3fp"
          Write-Host "`nPowered by https://www.facebook.com/Dr.Hussein.Ahmed.H/"
          while ($true) {
              Write-Host "[$(Get-Date)] Parsec + Tailscale Active"
              Start-Sleep -Seconds 300
          }
