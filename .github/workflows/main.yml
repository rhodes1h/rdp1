name: RDP
on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 3600
    steps:
      - name: Ownership Verification (Encoded)
        run: |
          $encodedNotice = ""
          $decodedNotice = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($encodedNotice))
          Write-Host $decodedNotice
          if (-not $decodedNotice -or $decodedNotice -notlike "*facebook.com/Dr.Hussein.Ahmed.H*") {
              Write-Error "Copyright was tampered with or removed – script will not work!"
              exit 1
          }

      - name: Core RDP Settings
        run: |
          $folderPath = "D:\link follow facebook channel"
          if (-Not (Test-Path -Path $folderPath)) {
              New-Item -Path $folderPath -ItemType Directory
              Write-Host "Folder 'link follow facebook channel' has been created in D drive."
          } else {
              Write-Host "Folder 'link follow facebook channel' already exists in D drive."
          }

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Static Password
        run: |
          $password = "admin@123"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "HUSSEIN" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "HUSSEIN" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "HUSSEIN"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "HUSSEIN"
          echo "RDP_CREDS=User: HUSSEIN | Password: $password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      # ====================== الجزء الجديد: Parsec + VDD ======================
      - name: Install Parsec (Silent)
        run: |
          $parsecUrl = "https://parsec.app/downloads/parsec-windows.exe"
          $installerPath = "$env:TEMP\parsec.exe"
          Invoke-WebRequest -Uri $parsecUrl -OutFile $installerPath -UseBasicParsing
          Start-Process -FilePath $installerPath -ArgumentList "/silent" -Wait -NoNewWindow
          Remove-Item $installerPath -Force
          Write-Host "✅ Parsec installed successfully"

      - name: Install Parsec Virtual Display Driver (VDD) - يحل مشكلة -14003
        run: |
          $vddUrl = "https://github.com/nomi-san/parsec-vdd/releases/latest/download/parsec-vdd-setup.exe"
          $vddPath = "$env:TEMP\parsec-vdd-setup.exe"
          Invoke-WebRequest -Uri $vddUrl -OutFile $vddPath -UseBasicParsing
          Start-Process -FilePath $vddPath -ArgumentList "/S" -Wait -NoNewWindow
          Remove-Item $vddPath -Force
          Write-Host "✅ Parsec VDD installed successfully (Virtual Display ready)"

      - name: Maintain Connection + Parsec Info
        run: |
          $ownershipNotice = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String(""))
          Write-Host $ownershipNotice
          Write-Host "`n=== RDP + PARSEC ACCESS ==="
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Username     : HUSSEIN"
          Write-Host "Password     : admin@123"
          Write-Host "`n=== PARSEC INFO ==="
          Write-Host "1. افتح RDP على $env:TAILSCALE_IP"
          Write-Host "2. سجل دخول في Parsec بحسابك (Hussein1h#19315983)"
          Write-Host "3. افتح ParsecVDisplay (من Start Menu) → Add Virtual Display"
          Write-Host "4. في Parsec → Settings → Host → Hosting Enabled"
          Write-Host "5. ارجع لجهازك الأصلي → Parsec → Reload → Connect على runnervmxu3fp"
          Write-Host "`nPowered by https://www.facebook.com/Dr.Hussein.Ahmed.H/"
          Write-Host "========= All rights reserved =========`n"
          while ($true) {
              Write-Host "[$(Get-Date)] RDP + Parsec Active - Use Ctrl+C to terminate"
              Start-Sleep -Seconds 300
          }
