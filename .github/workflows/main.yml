name: Secure RDP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-rdp
  cancel-in-progress: true

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      RDP_USERNAME: HUSSEIN

    steps:
      - name: Validate required secrets
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.TAILSCALE_AUTH_KEY }}")) {
            throw "Missing GitHub secret: TAILSCALE_AUTH_KEY"
          }

          if ([string]::IsNullOrWhiteSpace("${{ secrets.RDP_PASSWORD }}")) {
            throw "Missing GitHub secret: RDP_PASSWORD"
          }

      - name: Prepare workspace
        shell: powershell
        run: |
          $folderPath = "D:\RDP"
          New-Item -Path $folderPath -ItemType Directory -Force | Out-Null

      - name: Configure secure RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'fPromptForPassword' -Value 1 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10,fd7a:115c:a1e0::/48

          Restart-Service -Name TermService -Force

      - name: Create RDP user
        shell: powershell
        run: |
          $username = $env:RDP_USERNAME
          $password = "${{ secrets.RDP_PASSWORD }}"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          $existingUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($null -eq $existingUser) {
            New-LocalUser -Name $username -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          } else {
            Set-LocalUser -Name $username -Password $securePass
          }

          try {
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction Stop
          } catch {
            Write-Host "User already in Remote Desktop Users or could not be added again."
          }

          try {
            Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction Stop
          } catch {
            Write-Host "User already in Administrators or could not be added again."
          }

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Connect Tailscale
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="gh-runner-$env:GITHUB_RUN_ID" --accept-dns=false --reset

          $tsIP = $null
          for ($i = 0; $i -lt 12; $i++) {
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            if ($tsIP) { break }
            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify RDP service
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          $rdpTest = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389

          if (-not $rdpTest.TcpTestSucceeded) {
            throw "RDP port 3389 is not listening."
          }

      - name: Print connection info
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=== RDP READY ==="
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : $env:RDP_USERNAME"
          Write-Host "Password : stored in GitHub secret RDP_PASSWORD"
          Write-Host "================="
          Write-Host ""

          @"
          ## RDP Ready
          - Address: $env:TAILSCALE_IP
          - Username: $env:RDP_USERNAME
          - Password: use the GitHub secret RDP_PASSWORD
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) {
            Write-Host "[$(Get-Date -Format s)] RDP session alive"
            Start-Sleep -Seconds 300
          }
